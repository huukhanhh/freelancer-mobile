name: workly
description: Flutter frontend foundation for the approved Workly Figma design.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  go_router: ^18.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/auth/
    - assets/home/
    - assets/discovery/
  fonts:
    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
